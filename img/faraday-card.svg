<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="1.3" fill="#141210" fill-opacity=".1"/></pattern>
    <pattern id="mesh" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#c4713a" stroke-opacity=".3" stroke-width="1.2"/></pattern>
    <radialGradient id="glow"><stop offset="0" stop-color="#e39a62" stop-opacity=".7"/><stop offset="1" stop-color="#e39a62" stop-opacity="0"/></radialGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff4b3e" stop-opacity="0"/><stop offset="1" stop-color="#ff4b3e"/></linearGradient>
    <symbol id="cm" viewBox="0 0 32 32"><rect x="3" y="3" width="26" height="26" rx="7" fill="none" stroke="#141210" stroke-width="2.6"/><path d="M11.7 3.5v25M20.3 3.5v25M3.5 11.7h25M3.5 20.3h25" stroke="#141210" stroke-width="1.6" stroke-opacity=".6"/><circle cx="16" cy="16" r="3.6" fill="#141210"/></symbol>
  </defs>
  <rect width="1200" height="630" fill="#f3eee3"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- brand -->
  <g transform="translate(64 56)">
    <rect x="4" y="4" width="60" height="60" rx="15" fill="#141210"/>
    <rect width="60" height="60" rx="15" fill="#ffd83d" stroke="#141210" stroke-width="3"/>
    <use href="#cm" x="9" y="9" width="42" height="42"/>
    <text x="80" y="43" font-family="Bricolage Grotesque, Arial Black, sans-serif" font-weight="800" font-size="40" fill="#141210" letter-spacing="-1.5">faraday</text>
  </g>

  <!-- headline -->
  <g font-family="Bricolage Grotesque, Arial Black, sans-serif" font-weight="800" fill="#141210" letter-spacing="-3.5">
    <text x="60" y="246" font-size="86">Your banner</text>
    <text x="60" y="336" font-size="86">says no.</text>
    <rect x="240" y="298" width="118" height="10" rx="5" fill="#ff4b3e" transform="rotate(-4 299 303)"/>
    <rect x="50" y="364" width="356" height="98" rx="14" fill="#ffd83d" stroke="#141210" stroke-width="3"/>
    <text x="64" y="436" font-size="86">Prove it.</text>
  </g>
  <text x="62" y="526" font-family="Instrument Sans, system-ui, sans-serif" font-weight="600" font-size="24" fill="#5d574f">A sealed-browser consent audit.</text>
  <text x="62" y="560" font-family="Instrument Sans, system-ui, sans-serif" font-weight="600" font-size="24" fill="#5d574f">Every tag runs. Nothing gets out.</text>

  <!-- cage panel -->
  <g transform="rotate(2.2 930 315)">
    <rect x="688" y="58" width="460" height="520" rx="26" fill="#141210" transform="translate(10 10)"/>
    <rect x="680" y="50" width="460" height="520" rx="26" fill="#141210" stroke="#141210" stroke-width="3"/>
    <rect x="708" y="78" width="404" height="420" rx="18" fill="url(#mesh)"/>
    <circle cx="708" cy="200" r="80" fill="url(#glow)"/>
    <circle cx="1112" cy="150" r="80" fill="url(#glow)"/>
    <circle cx="960" cy="498" r="80" fill="url(#glow)"/>
    <circle cx="1112" cy="400" r="70" fill="url(#glow)"/>
    <rect x="708" y="78" width="404" height="420" rx="18" fill="none" stroke="#c4713a" stroke-width="5"/>
    <g fill="#e39a62" stroke="#141210" stroke-width="2"><circle cx="708" cy="78" r="7"/><circle cx="1112" cy="78" r="7"/><circle cx="708" cy="498" r="7"/><circle cx="1112" cy="498" r="7"/></g>
    <!-- trails -->
    <g stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M1020 300 L1112 150" stroke="url(#trail)"/>
      <path d="M1020 360 L1112 400" stroke="url(#trail)"/>
      <path d="M1020 360 L960 498" stroke="#ff4b3e" stroke-opacity=".8"/>
      <path d="M1020 300 L708 200" stroke="#ff4b3e" stroke-opacity=".55"/>
    </g>
    <g fill="none" stroke="#ffd83d" stroke-width="3"><circle cx="1112" cy="150" r="14"/><circle cx="1112" cy="400" r="20" stroke-opacity=".6"/><circle cx="960" cy="498" r="12"/><circle cx="708" cy="200" r="16" stroke-opacity=".7"/></g>
    <g fill="#ff4b3e" stroke="#141210" stroke-width="2"><circle cx="1112" cy="150" r="6"/><circle cx="1112" cy="400" r="6"/><circle cx="960" cy="498" r="6"/><circle cx="708" cy="200" r="6"/></g>
    <!-- page -->
    <rect x="796" y="198" width="250" height="206" rx="12" fill="#000"  transform="translate(7 7)"/>
    <rect x="796" y="198" width="250" height="206" rx="12" fill="#f3eee3" stroke="#141210" stroke-width="2.5"/>
    <path d="M796 226H1046" stroke="#141210" stroke-width="2.5"/>
    <circle cx="812" cy="212" r="4.5" fill="#ff4b3e"/><circle cx="826" cy="212" r="4.5" fill="#ffd83d"/><circle cx="840" cy="212" r="4.5" fill="#12b76a"/>
    <text x="856" y="217" font-family="JetBrains Mono, monospace" font-size="12" fill="#141210">shop.test/checkout</text>
    <rect x="810" y="238" width="118" height="24" rx="12" fill="#ff4b3e" stroke="#141210" stroke-width="2"/>
    <text x="822" y="255" font-family="Instrument Sans, sans-serif" font-weight="700" font-size="13" fill="#141210">REJECTED ALL</text>
    <g font-family="Instrument Sans, sans-serif" font-weight="600" font-size="14" fill="#141210">
      <circle cx="830" cy="300" r="9" fill="#fffcf5" stroke="#f79009" stroke-width="4"/><text x="846" y="305">analytics</text>
      <circle cx="830" cy="360" r="9" fill="#fffcf5" stroke="#3d5afe" stroke-width="4"/><text x="846" y="365">social</text>
      <circle cx="1020" cy="300" r="10" fill="#ff4b3e" stroke="#141210" stroke-width="2"/><text x="934" y="305">ad tag</text>
      <circle cx="1020" cy="360" r="10" fill="#ff4b3e" stroke="#141210" stroke-width="2"/><text x="912" y="365">4th party</text>
    </g>
    <!-- HUD -->
    <g font-family="JetBrains Mono, monospace" font-size="15">
      <rect x="708" y="514" width="196" height="38" rx="9" fill="#1e1b18" stroke="#3a352f" stroke-width="1.5"/>
      <text x="722" y="539" fill="#f3eee3">caught at wall <tspan fill="#ffd83d">12</tspan></text>
      <rect x="914" y="514" width="198" height="38" rx="9" fill="#1e1b18" stroke="#3a352f" stroke-width="1.5"/>
      <text x="928" y="539" fill="#f3eee3">reached vendor <tspan fill="#6ee7a8">0</tspan></text>
    </g>
  </g>

  <!-- sticker -->
  <g transform="translate(640 92) rotate(-12)">
    <circle r="62" fill="#141210" transform="translate(5 5)"/>
    <circle r="62" fill="#ffd83d" stroke="#141210" stroke-width="3"/>
    <text y="-4" text-anchor="middle" font-family="Bricolage Grotesque, Arial Black, sans-serif" font-weight="800" font-size="22" fill="#141210">CLOSED</text>
    <text y="20" text-anchor="middle" font-family="Bricolage Grotesque, Arial Black, sans-serif" font-weight="800" font-size="22" fill="#141210">BETA</text>
  </g>
</svg>
